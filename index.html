<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h2>Weather App</h2>

        <div class="search-area" class="fade-in">
            <input type="text" id="city" placeholder="Enter city name">
            <button id="searchBtn">Search</button>
        </div>

        <button id="locBtn" class="loc-btn">My Location Weather</button>
        <div id="loader" class="loader" style="display:none;"></div>
        <div id="result" class="weather-card slide-up card hidden">
            <div class="weather-main">
                <img id="icon" class="big-icon float">
                <div class="details" class="fade-in">
                    <h3 id="cityName" class="fade-in"></h3>
                    <p id="temp" class="fade-in"></p>
                    <p id="desc"></p>
                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
